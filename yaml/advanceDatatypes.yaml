 # dictionary !!omap
 people: !!omap
   - Manish:
      name: Manish Tomar
      age: 25
      height: 748
   - Arya:
      name: Arya Dubey
      age: 24
      height: 564


# reusing some properties using anchoirs
likings: &likes
  fav fruit: mango
  dislikes: grapes

person1:
  name: Manish Tomar
  <<: *likes
  
person2:
  name: Rahul
  <<: *likes
  dislikes: berries #overwritten by berries

# this will look like
person2:
  name: Rahul
  fav fruit: mango
  dislikes: berries #overwritten by berries

person3:
  name: Apoorv
  fav fruit: mango
  dislikes: grapes
